# マーケットプレイスと各 mod の検査・テスト。voice-notify が Windows・macOS・Linux に対応するので、3 つの OS で回す。
# claude plugin validate / test はログインなしで動く。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and mods
        shell: pwsh
        run: |
          claude --version
          claude plugin validate .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($mod in Get-ChildItem mods -Directory) {
            claude plugin validate $mod.FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Test mods (tests/*.test.ts)
        shell: pwsh
        run: |
          foreach ($mod in Get-ChildItem mods -Directory) {
            if (-not (Get-ChildItem (Join-Path $mod.FullName "tests") -Filter *.test.ts -ErrorAction SilentlyContinue)) { continue }
            claude plugin test $mod.FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Check the POSIX play script (syntax and lock)
        if: runner.os != 'Windows'
        run: |
          sh -n mods/voice-notify/scripts/posix/play.sh
          sh mods/voice-notify/tests/posix/test-play-lock.sh
